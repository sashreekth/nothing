<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>course</title>
</head>
<body>
    <h1>Course Registration</h1>
    <fieldset>
    <legend>Personal Details</legend>
     
      <form action="ThankYou.html">
        <table>
         <tr>
            <td><label>First Name</label></td>
            <td><input type="text" name="FN" placeholder="Ex:your name" size="16" required></td>
         </tr>

         <tr>
            <td><label>Surname</label></td>
            <td><input type="text" name="SN" placeholder="Ex:your Surname" size="16" required></td>
         </tr>

         <tr>
            <td><label>Mobile Number</label></td>
            <td><input type="number" placeholder="Ex:633-636-789" required></td>
         </tr>

         <tr>
            <td><label>Email</label></td>
            <td><input type="email" placeholder="Ex:some@gmail.com" required></td>
         </tr>

         <tr>
            <td><label>Password</label></td>
            <td><input type="password" required></td>
         </tr>

         <tr>
            <td><label>Confirm Password</label></td>
            <td><input type="password" required></td>
         </tr>

         <tr>
            <td><label>DOB</label></td>
            <td><input type="date" required></td>
         </tr>

         <tr>
            <td><label>Gender</label></td>
            <td><input type="radio">Male</td>
            <td><input type="radio">Female</td>
            <td><input type="radio">Other</td>
         </tr>
         
        </table> 
         

        <label>Select Country</label>
        <select>
            <option>INDIA</option>
            <option>JAPAN</option>
        </select><br>

        <label>Upload File</label>
        <input type="file"><br>

        <input type="reset"><br>
        <input type="submit">
        
    


     </form>

    </fieldset>
    
</body>
</html>
